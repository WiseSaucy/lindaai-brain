name: site-check
on:
  push:
    branches: ["claude/lindaai-brain-issue-vfnk4o"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe site endpoints
        run: |
          for url in https://lindaai-brain.com/ https://www.lindaai-brain.com/ https://wisesaucy.github.io/lindaai-brain/ https://lindaai-brain.com/pitch.html https://lindaai-brain.com/checkout.html; do
            echo "=== $url ==="
            curl -sS -o /dev/null -m 25 -w 'status=%{http_code} redirect=%{redirect_url}\n' "$url" || echo "curl exit $?"
          done
          echo "=== full chain apex ==="
          curl -sSL -o /dev/null -m 40 -w 'final=%{url_effective} status=%{http_code}\n' https://lindaai-brain.com/ || echo "curl exit $?"
  deck-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit deck slides for overflow at embed + mobile sizes
        run: |
          cat > audit.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            for (const [label, w, h] of [['embed-desktop', 996, 880], ['embed-mobile', 375, 880], ['fullscreen', 1440, 900]]) {
              const page = await browser.newPage({ viewport: { width: w, height: h } });
              await page.goto('https://lindaai-brain.com/pitch.html', { waitUntil: 'networkidle', timeout: 45000 });
              await page.evaluate(() => { if (typeof togglePlay === 'function' && autoPlay) togglePlay(); });
              const total = await page.evaluate(() => document.querySelectorAll('.slide').length);
              console.log(`\n=== ${label} ${w}x${h} — ${total} slides ===`);
              for (let i = 0; i < total; i++) {
                await page.evaluate((idx) => goTo(idx), i);
                await page.waitForTimeout(900);
                const r = await page.evaluate(() => {
                  const s = document.querySelector('.slide.active');
                  const title = (s.querySelector('h1,h2')?.textContent || '').trim().slice(0, 38);
                  const vOver = Math.max(0, s.scrollHeight - s.clientHeight);
                  let hOver = 0, worst = '';
                  s.querySelectorAll('*').forEach(el => {
                    const b = el.getBoundingClientRect();
                    const over = Math.max(0, Math.round(b.right - window.innerWidth), Math.round(-b.left));
                    if (over > hOver && b.width > 0) { hOver = over; worst = el.className || el.tagName; }
                  });
                  return { title, vOver, hOver, worst };
                });
                const flag = (r.vOver > 4 || r.hOver > 4) ? '  <-- OVERFLOW' : '';
                console.log(`slide ${String(i + 1).padStart(2)} | ${r.title.padEnd(40)} | vScroll=${String(r.vOver).padStart(4)}px hClip=${String(r.hOver).padStart(3)}px ${r.worst && r.hOver > 4 ? '(' + String(r.worst).slice(0, 30) + ')' : ''}${flag}`);
              }
              await page.close();
            }
            await browser.close();
          })();
          EOF
          node audit.js
